name: 화면 배포

# 세 가지 경로가 한 워크플로를 같이 사용한다.
# - push(등록부·코드 수정): 바뀐 작품을 검사·편성하고 배포한다
# - 정기 실행(평일 하루 세 번): 오래된 검사 결과를 다시 검사하고 편성한다
# - 수동 실행(휴대폰): 긴급 정지·공지·원격 시연. 빠르게 반영되도록 작품 검사는 건너뛴다(필요하면 check_projects를 켠다)
on:
  push:
    branches: [main]
  schedule:
    - cron: '40 22 * * 0-4'   # 평일 07:40 (한국 시간)
    - cron: '10 3 * * 1-5'    # 평일 12:10
    - cron: '40 6 * * 1-5'    # 평일 15:40
  workflow_dispatch:
    inputs:
      mode:
        description: '화면 상태 (normal 평소 / stop 긴급 정지)'
        type: choice
        options: [normal, stop]
        default: normal
      notice:
        description: '공지 문구 (비워 두면 공지 없음)'
        required: false
        default: ''
      showcase_url:
        description: '원격 시연: 작품 번호나 id, 또는 주소 (비워 두면 원격 시연 끔)'
        required: false
        default: ''
      showcase_title:
        description: '원격 시연 이름 (주소를 넣었을 때만)'
        required: false
        default: ''
      check_projects:
        description: '작품 검사도 함께 실행 (긴급 정지 때는 끄기)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 대기하던 실행도 앞선 실행의 커밋을 포함한 최신 main에서 시작한다 (트리거 시점 커밋에서 시작하면 push가 거절된다)
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 입력값은 '바꿀 내용'이 아니라 '원하는 최종 상태'다. 그래서 push가 거절되면 최신 main 위에서 다시 적용하면 된다.
      # 같은 그룹에서 대기 중인 실행은 새 실행이 들어오면 취소되는데, 마지막 요청이 최종 상태이므로 결과는 같다.
      - name: 콘텐츠 갱신 (수동 실행일 때만)
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          NOTICE: ${{ inputs.notice }}
          SC_URL: ${{ inputs.showcase_url }}
          SC_TITLE: ${{ inputs.showcase_title }}
        run: |
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/bump.py --mode="$MODE" --notice="$NOTICE" --showcase-url="$SC_URL" --showcase-title="$SC_TITLE"
            git add site/content.json
            git commit -q -m "화면 시험: 콘텐츠 갱신 ($MODE)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push 거절, ${i}번째 재시도"
            sleep $((i * 5))
          done
          exit 1

      # 수동 실행에서 작품 검사를 켜면 모든 작품을 다시 검사한다
      - name: 작품 검사 계획
        id: plan
        if: github.event_name != 'workflow_dispatch' || inputs.check_projects
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="--all"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 scripts/check_projects.py --plan $ARGS)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.count && steps.plan.outputs.count != '0'
        with:
          python-version: '3.12'

      - name: Playwright와 한글 글꼴 준비 (검사할 작품이 있을 때만)
        if: steps.plan.outputs.count && steps.plan.outputs.count != '0'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
          python -m pip install -q playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: 작품 검사
        if: steps.plan.outputs.count && steps.plan.outputs.count != '0'
        run: python scripts/check_projects.py ${{ steps.plan.outputs.args }}

      - name: 작품 편성
        run: python3 scripts/build_projects.py

      - name: 검사·편성 결과 커밋
        run: |
          git add -A site/projects site/p site/content.json projects/registry.json
          if git diff --cached --quiet; then echo "바뀐 결과 없음"; exit 0; fi
          git commit -q -m "작품 검사·편성 갱신"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push 거절, ${i}번째 재시도"
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
