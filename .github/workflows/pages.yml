name: 화면 배포

# 빠른 경로. 등록부·화면 제어가 바뀌거나(push) 휴대폰에서 수동 실행하면 바로 편성·배포한다.
# 시간이 오래 걸리는 작품 검사는 「작품 검사」 워크플로가 따로 하고, 끝나면 redeploy로 이 워크플로를 다시 부른다.
# 상태는 실행 입력이 아니라 커밋된 파일에 있으므로, 대기 중인 실행이 취소돼도 다음 실행이 최신 main을 배포한다.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [redeploy]
  workflow_dispatch:
    inputs:
      mode:
        description: '화면 상태 (normal 평소 / stop 긴급 정지)'
        type: choice
        options: [normal, stop]
        default: normal
      notice:
        description: '공지 문구 (비워 두면 공지 없음)'
        required: false
        default: ''
      showcase_url:
        description: '원격 시연: 작품 번호나 id, 또는 주소 (비워 두면 원격 시연 끔)'
        required: false
        default: ''
      showcase_title:
        description: '원격 시연 이름 (주소를 넣었을 때만)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 대기하던 실행도 앞선 실행의 커밋을 포함한 최신 main에서 시작한다
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 휴대폰 수동 실행: 입력값은 '원하는 최종 상태'라서 push가 거절되면 최신 main 위에서 다시 적용하면 된다
      - name: 화면 제어 갱신 (휴대폰 수동 실행일 때만)
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          NOTICE: ${{ inputs.notice }}
          SC_URL: ${{ inputs.showcase_url }}
          SC_TITLE: ${{ inputs.showcase_title }}
        run: |
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/bump.py --mode="$MODE" --notice="$NOTICE" --showcase-url="$SC_URL" --showcase-title="$SC_TITLE"
            git add projects/control.json
            git commit -q -m "화면 제어: 휴대폰 수동 실행 ($MODE)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push 거절, ${i}번째 재시도"
            sleep $((i * 5))
          done
          exit 1

      - name: 편성
        run: python3 scripts/build_projects.py

      # 편성 결과 파일은 이 워크플로만 쓰므로, 거절되면 최신 main을 받아 편성을 다시 하면 된다
      - name: 편성 결과 커밋
        run: |
          for i in 1 2 3; do
            git add -A site/content.json site/projects/index.json site/p projects/assigned.json
            if git diff --cached --quiet; then echo "바뀐 결과 없음"; exit 0; fi
            git commit -q -m "편성 갱신"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push 거절, ${i}번째 재시도"
            sleep $((i * 5))
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/build_projects.py
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
