<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명예의 전당 닉네임 · AI중점학교 당곡고</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/favicon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* 학교 화면(스탠바이미) 게임이 끝난 뒤 화면의 QR로 여는 휴대폰 닉네임 등록. 주소의 일회용 코드(c)로 그 기록 하나에만 이름을 적는다(15분 안, 한 번).
 * 이름·연락처는 받지 않는다. 닉네임은 서버(Apps Script)가 금칙어를 거르고, 선생님이 관리 화면에서 숨길 수 있다 */
:root { --bg: #f3fbe9; --card: #ffffff; --text: #2b2f45; --soft: #565d78; --muted: #8a8fa6; --line: rgba(43, 47, 69, 0.1); --accent: #ff7a1a; --ok: #2f8a3d; --bad: #e5484d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; color: var(--text); font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; min-height: 100vh;
  background: radial-gradient(90% 40% at 100% 0%, #d6f0ff 0%, rgba(214, 240, 255, 0) 70%), radial-gradient(80% 40% at 0% 100%, #fff0c7 0%, rgba(255, 240, 199, 0) 70%), var(--bg);
}
main { max-width: 520px; margin: 0 auto; padding: 24px 18px 40px; }
header p { margin: 0; color: var(--muted); font-size: 14px; font-weight: 600; }
.kicker { display: inline-block; color: #fff; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 99px; background: linear-gradient(90deg, #7c5cff, #3fa9ff); }
.fame-tag { margin: 2px 0 10px; font-size: 16px; font-weight: 800; color: #a16207; }
.rk.md { background: none !important; font-size: 20px; }
h1 { margin: 4px 0 4px; font-size: 27px; letter-spacing: -0.02em; }
.lead { color: var(--soft); font-size: 15px; line-height: 1.5; margin: 0 0 16px; }
.card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: 0 8px 22px rgba(47, 138, 61, 0.12); margin-bottom: 16px; }
label { display: block; font-weight: 800; font-size: 15px; margin-bottom: 8px; }
.row { display: flex; }
input { flex: 1; min-width: 0; font: inherit; font-size: 20px; font-weight: 700; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; outline: none; }
input:focus { border-color: var(--accent); }
button { font: inherit; font-weight: 800; font-size: 17px; border: 0; border-radius: 14px; padding: 0 18px; margin-left: 8px; color: #fff; background: linear-gradient(180deg, #ff9a3c, #ff6a1a); }
button:disabled { opacity: 0.5; }
.hint { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.5; }
.msg { font-weight: 700; margin-top: 10px; font-size: 15px; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
h2 { margin: 0 0 8px; font-size: 17px; color: #a16207; }
ol { margin: 0; padding: 0; list-style: none; }
li { display: flex; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-weight: 700; }
li:last-child { border-bottom: 0; }
.rk { width: 26px; height: 26px; border-radius: 50%; background: #eef1f6; color: #6b7085; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-right: 10px; flex: none; }
li.r1 .rk { background: #ffe17a; color: #6b4a00; } li.r2 .rk { background: #e5e9f0; color: #3f4a5e; } li.r3 .rk { background: #ffd6b0; color: #7c3a10; }
.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm.wait { color: var(--muted); font-weight: 600; font-size: 14px; }
.sc { color: var(--accent); margin-left: 8px; font-variant-numeric: tabular-nums; }
li.me { background: #fff3d6; border-radius: 10px; padding-left: 6px; }
.done { text-align: center; font-size: 18px; font-weight: 800; padding: 8px 0; }
.done b { display: block; font-size: 34px; color: var(--accent); margin: 4px 0; }
footer { margin-top: 22px; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <span class="kicker">🤖 AI중점학교 당곡고등학교</span>
    <h1 id="title">🔨 DG다 잡기 챌린지</h1>
    <p class="fame-tag">🏆 명예의 전당</p>
    <p class="lead">🎉 축하합니다! TOP 10에 들었습니다. 명예의 전당에 올릴 닉네임을 적습니다.</p>
  </header>
  <div class="card" id="form">
    <label for="nick">✏️ 닉네임 (8글자까지)</label>
    <div class="row"><input id="nick" maxlength="8" autocomplete="off" placeholder="예: 두더지왕"><button id="send">올리기 🚀</button></div>
    <div class="hint">실명 대신 닉네임을 적습니다. 욕설이나 다른 사람을 흉내 낸 이름은 올라가지 않거나 선생님이 숨길 수 있습니다. 한 기록에 한 번만, 15분 안에 적을 수 있습니다.</div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card" id="board" hidden><h2>👑 명예의 전당 TOP 10</h2><ol id="list"></ol></div>
  <footer>이름·연락처는 받지 않습니다. 닉네임과 점수는 학교 화면에 나옵니다.</footer>
</main>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const q = new URLSearchParams(location.search);
  const code = q.get('c') || '', game = q.get('g') || 'mole';
  const TITLE = { mole: '🔨 DG다 잡기 챌린지' };
  const MEDAL = ['🥇', '🥈', '🥉'];
  let api = '';
  $('title').textContent = TITLE[game] || '🎮 게임 챌린지';
  function board(top, meName) {
    $('board').hidden = false;
    $('list').innerHTML = (top || []).map((r, i) => `<li class="r${i + 1}${meName && r.n === meName ? ' me' : ''}">${i < 3 ? '<span class="rk md">' + MEDAL[i] + '</span>' : '<span class="rk">' + (i + 1) + '</span>'}` +
      `<span class="nm${r.n ? '' : ' wait'}">${r.n ? esc(r.n) : '✏️ 닉네임 적는 중'}</span><span class="sc">${esc(r.s)}점</span></li>`).join('') || '<li>아직 기록이 없습니다.</li>';
  }
  function say(t, kind) { $('msg').textContent = t; $('msg').className = 'msg' + (kind ? ' ' + kind : ''); }
  if (!/^[0-9a-f]{16}$/.test(code)) { $('form').innerHTML = '<div class="msg bad">주소가 올바르지 않습니다. 화면의 QR을 다시 찍어 주세요.</div>'; }
  fetch('../content.json?t=' + Date.now()).then((r) => r.json()).then((c) => {
    api = (c.vote && c.vote.api) || '';
    if (!api) return;
    return fetch(api + '?api=games&game=' + encodeURIComponent(game)).then((r) => r.json()).then((d) => { if (d && d.ok) board(d.top); });
  }).catch(() => {});
  $('send') && $('send').addEventListener('click', () => {
    const name = $('nick').value.trim();
    if (!name) { say('닉네임을 적어 주세요', 'bad'); return; }
    if (!api) { say('연결을 준비하는 중입니다. 잠시 뒤 다시 눌러 주세요', 'bad'); return; }
    $('send').disabled = true; say('올리는 중입니다');
    fetch(api, { method: 'POST', body: JSON.stringify({ api: 'gamename', code: code, name: name }) }).then((r) => r.json()).then((d) => {
      if (!d || !d.ok) { $('send').disabled = false; say((d && d.error) || '올리지 못했습니다', 'bad'); return; }
      $('form').innerHTML = `<div class="done">🎉 명예의 전당에 올랐습니다<b>${esc(d.rank)}위 · ${esc(d.score)}점</b>${esc(d.name)}</div>` +
        '<div class="hint" style="text-align:center">학교 화면에는 30초 안에 나옵니다.</div>';
      board(d.board, d.name);
    }).catch(() => { $('send').disabled = false; say('연결이 불안정합니다. 잠시 뒤 다시 눌러 주세요', 'bad'); });
  });
  $('nick') && $('nick').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) $('send').click(); });
})();
</script>
</body>
</html>
