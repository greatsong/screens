<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 두근두근 당곡</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #ff5c8a; font-family: 'Pretendard', sans-serif; color: #fff; user-select: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; transition: background 0.6s; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; transition: opacity 0.4s; }
  .scene.on { opacity: 1; }
  .big { font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
  /* 장면 1: 심장 박동 */
  .heart { font-size: 34vmin; animation: beat 0.469s infinite; filter: drop-shadow(0 2vmin 4vmin rgba(0,0,0,.2)); }
  @keyframes beat { 0%,100% { transform: scale(1) } 15% { transform: scale(1.18) } 30% { transform: scale(0.98) } 45% { transform: scale(1.1) } }
  .dgdg { font-size: 11vmin; margin-top: 3vmin; }
  /* 장면 2: 연도 넘김 */
  .year { font-size: 30vmin; position: relative; }
  .year .old { display: inline-block; transition: transform .7s cubic-bezier(.6,-0.4,.4,1.4), opacity .7s; }
  .flip .year .old { transform: translateY(-60vmin) rotate(-25deg); opacity: 0; }
  .year .new { position: absolute; left: 0; right: 0; top: 0; transform: translateY(60vmin) scale(.6); opacity: 0; transition: transform .7s cubic-bezier(.3,1.6,.5,1), opacity .5s; color: #ffe14d; }
  .flip .year .new { transform: none; opacity: 1; }
  .sub { font-size: 6vmin; font-weight: 700; margin-top: 2vmin; opacity: .95; }
  /* 장면 3: 제목 */
  .title span { display: inline-block; font-size: 17vmin; transform: translateY(40vmin); opacity: 0; }
  .on .title span { animation: pop .6s cubic-bezier(.3,1.7,.5,1) forwards; }
  @keyframes pop { to { transform: none; opacity: 1; } }
  .title .gap { width: 5vmin; }
  .tag2027 { font-size: 8vmin; font-weight: 800; color: #ffe14d; margin-bottom: 2vmin; }
  /* 장면 4: 키워드 */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 3vmin; max-width: 92vw; }
  .chip { font-size: 8vmin; font-weight: 800; padding: 2vmin 5vmin; border-radius: 99px; background: #fff; color: #ff4f7b; transform: scale(0); }
  .on .chip { animation: chip .45s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes chip { to { transform: scale(1) rotate(var(--r)); } }
  /* 장면 5: 커밍 순 */
  .soon { font-size: 15vmin; }
  .soon-sub { font-size: 7vmin; font-weight: 800; margin-top: 3vmin; color: #3a1340; background: #ffe14d; padding: 1.5vmin 5vmin; border-radius: 99px; }
  .school { position: absolute; left: 0; right: 0; text-align: center; bottom: 6vmin; font-size: 4.5vmin; font-weight: 700; opacity: .9; }
  /* 배경 장식 */
  .bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,.18); animation: rise linear infinite; }
  @keyframes rise { from { transform: translateY(110vh) } to { transform: translateY(-30vh) } }
  .confetti { position: absolute; top: -5vh; width: 1.6vmin; height: 2.6vmin; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
  #bar { position: fixed; left: 0; bottom: 0; height: .8vmin; background: #ffe14d; width: 0; }
  #tap { position: fixed; right: 3vmin; top: 3vmin; font-size: 3vmin; font-weight: 700; background: rgba(0,0,0,.25); padding: 1.2vmin 3vmin; border-radius: 99px; }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1"><div class="heart">💗</div><div class="big dgdg">ㄷㄱ ㄷㄱ</div></div>
  <div class="scene" id="s2"><div class="big year"><span class="old">2026</span><span class="new">2027</span></div><div class="sub" id="s2sub">2026, 정말 고마웠어!</div></div>
  <div class="scene" id="s3"><div class="tag2027">2027</div>
    <div class="big title"><span>두</span><span>근</span><span>두</span><span>근</span><span class="gap"></span><span>당</span><span>곡</span></div></div>
  <div class="scene" id="s4"><div class="chips">
    <div class="chip" style="--r:-4deg">인문사회 📚</div><div class="chip" style="--r:3deg">과학 🔬</div>
    <div class="chip" style="--r:-2deg">수학·정보·AI 🤖</div><div class="chip" style="--r:4deg">동아리 활동 🎸</div>
    <div class="chip" style="--r:-3deg">창체 활동 🌱</div></div>
    <div class="sub" style="margin-top:5vmin">다양한 프로그램이 2027년에 여러분을 기다립니다!</div></div>
  <div class="scene" id="s5"><div class="big soon">COMING SOON</div><div class="soon-sub">2027 두근두근 당곡 프로젝트</div></div>
  <div class="school">당곡고등학교</div>
</div>
<div id="bar"></div>
<div id="tap">화면을 누르면 소리가 나요 🔊</div>
<script>
// 15초 영상 한 편을 장면 시간표로 돌린다. 128BPM이라 한 마디가 1.875초, 8마디가 정확히 15초다.
const LEN = 15000, BEAT = 60000 / 128;
const scenes = [ ['s1', 0, 2800, '#ff5c8a'], ['s2', 2800, 5600, '#7b5cff'], ['s3', 5600, 9400, '#ff8a3d'],
                 ['s4', 9400, 12400, '#2ec4b6'], ['s5', 12400, 15000, '#ff5c8a'] ];
const stage = document.getElementById('stage'), bar = document.getElementById('bar');
let start = performance.now(), cur = '';

// 장면 3의 글자는 한 글자씩, 장면 4의 키워드는 한 개씩 박자에 맞춰 튀어나오게 한다
document.querySelectorAll('.title span').forEach((s, i) => s.style.animationDelay = (i * BEAT / 2) + 'ms');
document.querySelectorAll('.chip').forEach((s, i) => s.style.animationDelay = (i * BEAT) + 'ms');

for (let i = 0; i < 14; i++) {
  const b = document.createElement('div'); b.className = 'bubble';
  const s = 4 + Math.random() * 14; b.style.width = b.style.height = s + 'vmin';
  b.style.left = Math.random() * 100 + 'vw'; b.style.animationDuration = 6 + Math.random() * 8 + 's';
  b.style.animationDelay = -Math.random() * 10 + 's'; stage.appendChild(b);
}
function confetti() {
  const colors = ['#ffe14d', '#fff', '#7bdcff', '#b8ff7a', '#ffb3c7'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    stage.appendChild(c); setTimeout(() => c.remove(), 4500);
  }
}
function show(id) {
  if (id === cur) return; cur = id;
  scenes.forEach(([sid]) => { const el = document.getElementById(sid); el.classList.toggle('on', sid === id); el.classList.remove('flip'); });
  const el = document.getElementById(id);
  void el.offsetWidth; // 장면에 다시 들어올 때 애니메이션을 처음부터
  el.querySelectorAll('.title span, .chip').forEach(s => { s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; });
  stage.style.background = scenes.find(s => s[0] === id)[3];
  if (id === 's2') { document.getElementById('s2sub').textContent = '2026, 정말 고마웠어!';
    setTimeout(() => { el.classList.add('flip'); document.getElementById('s2sub').textContent = '2027, 두근두근 기대돼!'; confetti(); }, 1300); }
  if (id === 's5') confetti();
}
function tick() {
  const t = (performance.now() - start) % LEN;
  const s = scenes.find(([, a, b]) => t >= a && t < b); show(s[0]);
  bar.style.width = (t / LEN * 100) + '%';
  requestAnimationFrame(tick);
}
tick();

// ---------- 음악: 파일 없이 브라우저가 직접 만든다 (C-G-Am-F 진행, 킥·박수·멜로디) ----------
let ac = null, nextBar = 0, barNo = 0;
const N = n => 261.63 * Math.pow(2, n / 12); // 0 = 도
const chords = [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]];
const melody = [[12,0],[16,1],[19,2],[16,3],[14,4],[12,5],[14,6],[19,6.5], [16,0],[19,1],[21,2],[19,3],[17,4],[16,5],[14,6],[12,7]];
function tone(f, t, d, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
}
function kick(t) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.3); }
function clap(t) { const len = ac.sampleRate * 0.12, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1200;
  g.gain.value = 0.35; s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start(t); }
function scheduleBar(t, n) {
  const b = BEAT / 1000, ch = chords[n % 4];
  for (let i = 0; i < 4; i++) { kick(t + i * b); if (i % 2) clap(t + i * b); }
  if (n === 0) { tone(N(-12), t, 0.25, 'sine', 0.5); tone(N(-12), t + b * 0.45, 0.25, 'sine', 0.4); } // 첫 마디: 두근
  ch.forEach(x => tone(N(x - 12), t, b * 3.6, 'triangle', 0.07));
  for (let i = 0; i < 8; i++) tone(N(ch[0] - 24), t + i * b / 2, b / 2.2, 'square', 0.05); // 통통 튀는 베이스
  if (n >= 2) melody.filter((_, i) => Math.floor(i / 8) === n % 2).forEach(([p, at]) => tone(N(p), t + at * b / 2, b / 2, 'sawtooth', 0.045));
}
function audioLoop() {
  while (nextBar < ac.currentTime + 0.5) { scheduleBar(nextBar, barNo % 8); nextBar += BEAT * 4 / 1000; barNo++; }
  setTimeout(audioLoop, 100);
}
document.addEventListener('pointerdown', () => {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  document.getElementById('tap').style.display = 'none';
  start = performance.now(); nextBar = ac.currentTime + 0.05; barNo = 0; audioLoop(); // 소리와 화면을 처음부터 함께 맞춘다
});
</script>
</body>
</html>
