<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 AI 뉴스 · 당곡고</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* 스탠바이미 B 화면의 QR로 여는 휴대폰용 AI 뉴스 목록. 화면과 같은 content.json 의 news 를 읽는다 */
:root {
  --bg: #f4f6fa; --card: #ffffff; --text: #182033; --soft: #4a566e; --muted: #7b869c; --line: #e3e7ef; --accent: #e8890c;
  --tech: #1f7fd6; --society: #d6336c; --economy: #1e9e5a; --science: #7048e8; --culture: #c77700;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1524; --card: #16213a; --text: #f3f6fb; --soft: #cfd8e6; --muted: #8e9cb5; --line: rgba(255,255,255,.12); --accent: #ffb547;
    --tech: #6cc4ff; --society: #ff8fb1; --economy: #7ee0a1; --science: #b8a5ff; --culture: #ffc069; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; }
main { max-width: 640px; margin: 0 auto; padding: 22px 16px 40px; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
h1 { margin: 4px 0 6px; font-size: 26px; letter-spacing: -0.02em; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
.chip { display: inline-block; font-size: 12.5px; font-weight: 800; color: var(--c); border: 1.5px solid var(--c); border-radius: 99px; padding: 2px 10px; }
article { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; }
article h2 { font-size: 18px; line-height: 1.4; margin: 10px 0 8px; letter-spacing: -0.01em; }
article p { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.6; }
.meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
.meta a { color: var(--accent); font-weight: 800; text-decoration: none; padding: 6px 0 6px 12px; }
footer { margin-top: 22px; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
.empty { margin-top: 30px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <p>당곡고등학교 스탠바이미</p>
    <h1>오늘의 AI 뉴스</h1>
    <p id="when"></p>
  </header>
  <div class="cats" id="cats"></div>
  <section id="list"><p class="empty">뉴스를 불러오는 중입니다.</p></section>
  <footer>새 모델, 성능 비교, 새로 발견한 문제와 해결, AI가 바꾸는 사회·경제·과학·문화 소식을 골랐습니다.
    제목과 요약 첫 문장만 보여 주며, 기사 전문은 각 언론사 사이트에서 읽을 수 있습니다.</footer>
</main>
<script>
const CAT = { tech: 'AI 기술', society: 'AI와 사회', economy: 'AI와 경제', science: 'AI와 과학·건강', culture: 'AI와 문화·생활' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = (s) => { const d = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return d ? (+d[2]) + '월 ' + (+d[3]) + '일' : ''; };
const color = (k) => `var(--${CAT[k] ? k : 'tech'})`;
fetch('content.json?t=' + Date.now()).then((r) => r.json()).then((c) => {
  const news = c.news || [];
  if (c.publishedAt) {
    const d = new Date(c.publishedAt);
    document.getElementById('when').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + d.getHours() + '시 기준 · ' + news.length + '건';
  }
  const used = [...new Set(news.map((n) => n.cat))];
  document.getElementById('cats').innerHTML = used.map((k) => `<span class="chip" style="--c:${color(k)}">${esc(CAT[k] || 'AI 뉴스')}</span>`).join('');
  document.getElementById('list').innerHTML = news.length ? news.map((n) => `
    <article>
      <span class="chip" style="--c:${color(n.cat)}">${esc(CAT[n.cat] || 'AI 뉴스')}</span>
      <h2>${esc(n.title)}</h2>
      ${n.summary ? `<p>${esc(n.summary)}</p>` : ''}
      <div class="meta"><span>${esc([n.source, md(n.date)].filter(Boolean).join(' · '))}</span>
        <a href="${esc(n.link)}" target="_blank" rel="noopener">기사 읽기 →</a></div>
    </article>`).join('') : '<p class="empty">지금은 고른 뉴스가 없습니다.</p>';
}).catch(() => { document.getElementById('list').innerHTML = '<p class="empty">뉴스를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</p>'; });
</script>
</body>
</html>
